<!--
  The webflow-vue bridge.

  Paste this into your Webflow page's custom code, in the FOOTER block, and
  publish. Page level only, and exactly one per page.

  WHY THE FOOTER: a code embed's scripts run at parse time, so the bridge has to
  come after the islands it mounts.

  WHY THE PAGE and not a site-level App integration: Webflow deletes code added
  by an App on the next publish after that App's access is revoked. Code in this
  box belongs to your site and cannot vanish that way.

  WHAT IT DOES: it chooses, in the browser, where your island code comes from.
  Webflow serves the same HTML either way and knows nothing about ?debug.

      normal URL  ->  Vue + webflow-vue from the CDN, then your built bundle
      ?debug      ->  https://localhost:3000 (your Vite dev server, with HMR)

  The library version is the version in the src below — the bridge loads the
  webflow-vue build that shipped alongside it, so there is only ever one version
  to keep track of.

  BEFORE IT WORKS: add data-bundle, pointing at your built bundle.
    1. npm run build            -> dist/main.js
    2. rename it to main.txt    (Webflow assets reject .js; the name matters,
                                 an asset URL is <site-id>/<asset-id>_<filename>)
    3. upload it to your site's Assets, copy the URL
    4. paste that URL into data-bundle below

  Until then the page logs exactly what is missing instead of failing silently.

  OPTIONAL ATTRIBUTES
    data-staging-bundle  a separate bundle for *.webflow.io, if staging and
                         production should differ
    data-dev             dev entry             (default https://localhost:3000/src/main.js)
    data-vite-client     Vite HMR client       (default https://localhost:3000/@vite/client)
    data-vue             Vue build             (default the CDN production build)
    data-library         webflow-vue build     (default: derived from this tag's src)
    data-debug-param     query param to switch to the dev server (default "debug")
-->

<script
  src="https://cdn.jsdelivr.net/npm/webflow-vue@__WEBFLOW_VUE_VERSION_EXACT__/dist/bridge.global.js"
  data-bundle=""
></script>
