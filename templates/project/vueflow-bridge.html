<!--
  Vueflow bridge v0.3.0 — install as PAGE-LEVEL custom code.

  Site-level + page-level together mounts Vue twice. Page level only.

  Routes the app bundle by environment:
    ?debug        -> local Vite dev server, with HMR live on the Webflow page
    *.webflow.io  -> staging bundle
    prod host     -> prod bundle

  In debug, Vite serves Vue and Vueflow out of node_modules, so injecting the
  CDN copies as well would load two Vue instances whose reactivity does not
  interoperate. Outside debug there is no bundler, so both come from the CDN
  and the app bundle carries only your own code.

  Webflow MCP constraint: registered inline scripts must be raw JS — no <script>
  tags, no external src attributes. Hence addScript() instead of markup.

  BEFORE THIS WORKS, REPLACE:
    SITE_ID, STAGING_ASSET_ID, PROD_ASSET_ID
  Webflow assets reject .js, so upload dist/main.js renamed to bundle.txt. The
  CDN serves it without nosniff, so a classic script tag executes it.
-->
<script>
  function addScript(src, isModule, onload) {
    const s = document.createElement('script');
    s.setAttribute('type', isModule ? 'module' : 'text/javascript');
    s.setAttribute('src', src);
    if (onload) s.onload = onload;
    document.body.appendChild(s);
  }

  var VUEFLOW_VERSION = '__VUEFLOW_VERSION_TAG__';
  var url = new URL(window.location);
  var debug = url.searchParams.get('debug') !== null;

  var STAGING_BUNDLE = 'https://cdn.prod.website-files.com/SITE_ID/STAGING_ASSET_ID_main.txt';
  var PROD_BUNDLE = 'https://cdn.prod.website-files.com/SITE_ID/PROD_ASSET_ID_main.txt';

  if (debug) {
    // Vite owns the dependency graph here — do not inject CDN copies.
    addScript('https://localhost:3000/@vite/client', true);
    addScript('https://localhost:3000/src/main.js', true);
  } else {
    var VUE_CDN = 'https://unpkg.com/vue@3/dist/vue.global.prod.js';
    var VUEFLOW_CDN =
      'https://cdn.jsdelivr.net/gh/brmbh/vueflow@' + VUEFLOW_VERSION + '/dist/vueflow.global.js';

    addScript(VUE_CDN, false, function () {
      addScript(VUEFLOW_CDN, false, function () {
        addScript(url.host.match(/webflow\.io/) ? STAGING_BUNDLE : PROD_BUNDLE, false);
      });
    });
  }
</script>
